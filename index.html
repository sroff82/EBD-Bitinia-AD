<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escuela Bíblica Dominical - Control</title>

<meta name="theme-color" content="#4f46e5">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

</head>

<body class="bg-slate-50 h-screen">

<div id="root" class="h-full"></div>

<script type="text/babel">

const {useState, useEffect} = React;

emailjs.init("7l-eHxFpu6r0bbHUV");

const firebaseConfig = {
apiKey: "AIzaSyBHzlxpJNejD9_dsx6atUtfVo15ORsfGzc",
authDomain: "escuela-dominical-bcc99.firebaseapp.com",
projectId: "escuela-dominical-bcc99",
storageBucket: "escuela-dominical-bcc99.firebasestorage.app",
messagingSenderId: "1039366920419",
appId: "1:1039366920419:web:09f7c09e2370d3718b8dd6"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


// CLAVES
const CLAVES = {

ADMIN:"1234",

MAESTRO:"2222",

AUXILIAR:"3333",

LOGISTICA:"4444"

};


// CAMPOS OFICIALES

const CAMPOS = [

"La Isla",

"Las Delicias",

"El Amatal",

"Buenos Aires",

"Corozal 1",

"El Porvenir",

"El Cauloté",

"Corozal 2",

"Valle Encantado",

"La Playa"

];



function App(){

const[usuario,setUsuario]=useState(null);

const[rol,setRol]=useState("");

const[nombre,setNombre]=useState("");

const[campo,setCampo]=useState("");

const[clave,setClave]=useState("");

const[mensaje,setMensaje]=useState("");

const[maestros,setMaestros]=useState([]);

const[tab,setTab]=useState("inicio");


// cargar sesion

useEffect(()=>{

const data=localStorage.getItem("usuario");

if(data){

setUsuario(JSON.parse(data));

}

},[]);


// escuchar usuarios

useEffect(()=>{

return db.collection("maestros")

.onSnapshot(snapshot=>{

let lista=[];

snapshot.forEach(doc=>{

lista.push({

id:doc.id,

...doc.data()

});

});

setMaestros(lista);

});

},[]);


// enviar correo

function enviarCorreo(datos){

emailjs.send(

"service_475d2ya",

"template_516xc7k",

{

new_member:datos.nombre,

role:datos.rol+" "+(datos.campo||"")

}

);

}


// LOGIN

async function login(e){

e.preventDefault();

setMensaje("");

if(CLAVES[rol]!==clave){

setMensaje("Clave incorrecta");

return;

}


// ADMIN

if(rol==="ADMIN"){

const admin={

nombre:"Administrador",

rol:"ADMIN",

estado:"Activo"

};

setUsuario(admin);

localStorage.setItem("usuario",JSON.stringify(admin));

return;

}


// buscar

const query=await db.collection("maestros")

.where("nombre","==",nombre)

.where("rol","==",rol)

.where("campo","==",campo)

.get();


// nuevo

if(query.empty){

const nuevo={

nombre,

rol,

campo,

estado:"Pendiente",

fecha:Date.now()

};

await db.collection("maestros").add(nuevo);

enviarCorreo(nuevo);

setMensaje("Solicitud enviada");

return;

}


// existente

const data=query.docs[0].data();

if(data.estado!=="Activo"){

setMensaje("Pendiente de aprobación");

return;

}


// acceso permitido

const user={

id:query.docs[0].id,

...data

};

setUsuario(user);

localStorage.setItem("usuario",JSON.stringify(user));

}


// aprobar

async function aprobar(id){

await db.collection("maestros")

.doc(id)

.update({

estado:"Activo"

});

}


// cerrar sesion

function salir(){

setUsuario(null);

localStorage.removeItem("usuario");

}


// LOGIN VIEW

if(!usuario)

return(

<div className="flex justify-center items-center h-full bg-indigo-600">

<form

onSubmit={login}

className="bg-white p-8 rounded-3xl w-80 space-y-4">

<h2 className="text-xl font-bold text-center">

Escuela Bíblica Dominical

</h2>


<select

required

value={rol}

onChange={e=>setRol(e.target.value)}

className="w-full p-3 border rounded">

<option value="">Seleccione Rol</option>

<option value="ADMIN">Administrador</option>

<option value="MAESTRO">Maestro</option>

<option value="AUXILIAR">Auxiliar</option>

<option value="LOGISTICA">Logística</option>

</select>


{rol!=="" && rol!=="ADMIN" &&

<input

required

placeholder="Nombre completo"

value={nombre}

onChange={e=>setNombre(e.target.value)}

className="w-full p-3 border rounded"

/>

}


{(rol==="MAESTRO"||rol==="AUXILIAR") &&

<select

required

value={campo}

onChange={e=>setCampo(e.target.value)}

className="w-full p-3 border rounded">

<option value="">Seleccione Campo</option>

{CAMPOS.map(c=>

<option key={c}>{c}</option>

)}

</select>

}


<input

type="password"

required

placeholder="Clave"

value={clave}

onChange={e=>setClave(e.target.value)}

className="w-full p-3 border rounded"

/>


<button

className="w-full bg-indigo-600 text-white p-3 rounded">

Ingresar

</button>


<p className="text-center text-red-500">

{mensaje}

</p>

</form>

</div>

);


// SISTEMA VIEW

return(

<div className="h-full flex flex-col">


<header className="bg-indigo-600 text-white p-4 flex justify-between">

<div>

{usuario.nombre}

</div>

<button onClick={salir}>

Salir

</button>

</header>


<div className="flex">


<button

onClick={()=>setTab("inicio")}

className="p-3">

Inicio

</button>


{usuario.rol==="ADMIN" &&

<button

onClick={()=>setTab("admin")}

className="p-3">

Panel Admin

</button>

}

</div>


<div className="p-4">


{tab==="inicio" &&

<div>

Bienvenido {usuario.nombre}

</div>

}


{tab==="admin" && usuario.rol==="ADMIN" &&

<div>

<h3>Pendientes</h3>


{maestros

.filter(x=>x.estado==="Pendiente")

.map(x=>

<div key={x.id}

className="border p-2 flex justify-between">

{x.nombre} - {x.campo}

<button

onClick={()=>aprobar(x.id)}

className="bg-green-500 text-white px-2">

Aprobar

</button>

</div>

)}

</div>

}


</div>

</div>

);

}


ReactDOM.render(<App/>,document.getElementById("root"));

</script>

</body>
</html>
