<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Escuela Dominical - Control</title>
    
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjEwMCIgZmlsbD0iIzRmNDZlNSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI1NiI+8J+SmDwvdGV4dD48L3N2Zz4=">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- SDK para envío de correos -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ✅ Tu Public Key ya está configurada aquí
        emailjs.init("7l-eHxFpu6r0bbHUV"); 

        const firebaseConfig = {
            apiKey: "AIzaSyBHzlxpJNejD9_dsx6atUtfVo15ORsfGzc",
            authDomain: "escuela-dominical-bcc99.firebaseapp.com",
            projectId: "escuela-dominical-bcc99",
            storageBucket: "escuela-dominical-bcc99.firebasestorage.app",
            messagingSenderId: "1039366920419",
            appId: "1:1039366920419:web:09f7c09e2370d3718b8dd6",
            measurementId: "G-0KCFGX6CMD"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const CLAVES = {
            ADMIN: "1234",
            MAESTRO: "2222",
            AUXILIAR: "3333",
            LOGISTICA: "4444"
        };

        function App() {
            const [usuario, setUsuario] = useState(null);
            const [maestros, setMaestros] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [tabActiva, setTabActiva] = useState('inicio');
            const [busqueda, setBusqueda] = useState('');
            
            const [modalFormularioAbierto, setModalFormularioAbierto] = useState(false);
            const [maestroEnEdicion, setMaestroEnEdicion] = useState(null);
            const [idMaestroAEliminar, setIdMaestroAEliminar] = useState(null);
            
            const [rolSeleccionado, setRolSeleccionado] = useState('');
            const [claveIngresada, setClaveIngresada] = useState('');
            const [errorLogin, setErrorLogin] = useState('');

            useEffect(() => {
                const sesionGuardada = localStorage.getItem('rol_dominical');
                if (sesionGuardada) setUsuario(sesionGuardada);
            }, []);

            useEffect(() => {
                const unsubscribe = db.collection('maestros').onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => a.nombre.localeCompare(b.nombre));
                    setMaestros(data);
                    setCargando(false);
                });
                return () => unsubscribe();
            }, []);

            const enviarNotificacionCorreo = (datos) => {
                // ⚠️ RECUERDA: Cambia estos dos por los que aparecen en tu panel de EmailJS
                const SERVICE_ID = "service_475d2ya"; 
                const TEMPLATE_ID = "template_516xc7k";

                // Solo intenta enviar si ya cambiaste los IDs de arriba
                if (SERVICE_ID.includes("service_") && !SERVICE_ID.includes("xxxx")) {
                    emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                        to_name: "Director",
                        from_name: datos.registradoPor,
                        new_member: datos.nombre,
                        role: datos.clase
                    }).then(() => {
                        console.log("Notificación enviada al Director");
                    }).catch((err) => {
                        console.error("Error EmailJS:", err);
                    });
                }
            };

            const manejarLogin = (e) => {
                e.preventDefault();
                setErrorLogin('');
                if (claveIngresada === CLAVES[rolSeleccionado]) {
                    setUsuario(rolSeleccionado);
                    localStorage.setItem('rol_dominical', rolSeleccionado);
                } else {
                    setErrorLogin('Clave incorrecta.');
                }
            };

            const cerrarSesion = () => {
                setUsuario(null);
                localStorage.removeItem('rol_dominical');
            };

            const guardarMaestro = async (datosMaestro) => {
                try {
                    if (maestroEnEdicion) {
                        await db.collection('maestros').doc(maestroEnEdicion.id).update(datosMaestro);
                    } else {
                        const nuevoRegistro = { 
                            ...datosMaestro, 
                            estado: usuario === 'ADMIN' ? 'Activo' : 'Pendiente',
                            createdAt: Date.now(),
                            registradoPor: usuario
                        };
                        await db.collection('maestros').add(nuevoRegistro);
                        
                        if (usuario !== 'ADMIN') {
                            enviarNotificacionCorreo(nuevoRegistro);
                            alert("Registro enviado. El Director recibirá un correo para aprobarlo.");
                        }
                    }
                    setModalFormularioAbierto(false);
                    setMaestroEnEdicion(null);
                } catch (error) {
                    console.error("Error:", error);
                }
            };

            const aprobarMaestro = async (id) => {
                await db.collection('maestros').doc(id).update({ estado: 'Activo' });
            };

            const esAdmin = usuario === 'ADMIN';
            
            const maestrosVisibles = maestros.filter(m => {
                const coincideBusqueda = m.nombre.toLowerCase().includes(busqueda.toLowerCase());
                if (esAdmin) return coincideBusqueda; 
                return coincideBusqueda && m.estado === 'Activo'; 
            });

            const pendientes = maestros.filter(m => m.estado === 'Pendiente');

            if (!usuario) {
                return (
                    <div className="flex items-center justify-center h-full bg-indigo-600 p-6">
                        <div className="bg-white rounded-[40px] p-8 w-full max-w-sm shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="bg-indigo-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600">
                                    <i className="fas fa-church text-3xl"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800">Control Escolar</h2>
                                <p className="text-slate-500 text-sm">Ingresa tus credenciales</p>
                            </div>
                            
                            <form onSubmit={manejarLogin} className="space-y-4">
                                <select 
                                    required
                                    className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium"
                                    value={rolSeleccionado}
                                    onChange={(e) => setRolSeleccionado(e.target.value)}
                                >
                                    <option value="">¿Quién eres?</option>
                                    <option value="ADMIN">Director (Admin)</option>
                                    <option value="MAESTRO">Maestro</option>
                                    <option value="AUXILIAR">Auxiliar</option>
                                    <option value="LOGISTICA">Logística</option>
                                </select>
                                <input 
                                    type="password"
                                    required
                                    placeholder="Clave numérica"
                                    className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-center text-xl tracking-[0.5em]"
                                    value={claveIngresada}
                                    onChange={(e) => setClaveIngresada(e.target.value)}
                                />
                                {errorLogin && <p className="text-rose-500 text-xs text-center font-bold">{errorLogin}</p>}
                                <button type="submit" className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
                                    Entrar al Sistema
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen">
                    <header className="bg-white p-5 flex justify-between items-center border-b border-slate-100">
                        <div>
                            <p className="text-[10px] font-black uppercase tracking-widest text-indigo-500">Gestión Ministerial</p>
                            <h1 className="text-xl font-black text-slate-800">
                                {usuario === 'ADMIN' ? 'Panel Director' : `Sesión: ${usuario.toLowerCase()}`}
                            </h1>
                        </div>
                        <button onClick={cerrarSesion} className="w-10 h-10 bg-slate-50 rounded-xl text-slate-400 flex items-center justify-center">
                            <i className="fas fa-sign-out-alt"></i>
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto p-5 pb-24 bg-slate-50/50">
                        {tabActiva === 'inicio' && (
                            <div className="space-y-6">
                                {esAdmin && pendientes.length > 0 && (
                                    <div className="bg-amber-50 border border-amber-100 p-5 rounded-[32px] animate-pulse">
                                        <h3 className="text-amber-800 font-bold text-sm mb-3 flex items-center">
                                            <i className="fas fa-exclamation-circle mr-2"></i> Por Aprobar ({pendientes.length})
                                        </h3>
                                        <div className="space-y-3">
                                            {pendientes.map(p => (
                                                <div key={p.id} className="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                                                    <div>
                                                        <p className="font-bold text-slate-700 text-sm">{p.nombre}</p>
                                                        <p className="text-[10px] text-slate-400 font-bold uppercase">{p.clase}</p>
                                                    </div>
                                                    <div className="flex space-x-2">
                                                        <button onClick={() => aprobarMaestro(p.id)} className="w-8 h-8 bg-emerald-500 text-white rounded-lg text-xs"><i className="fas fa-check"></i></button>
                                                        <button onClick={() => setIdMaestroAEliminar(p.id)} className="w-8 h-8 bg-rose-100 text-rose-500 rounded-lg text-xs"><i className="fas fa-trash"></i></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-indigo-600 p-5 rounded-[32px] text-white shadow-xl shadow-indigo-100">
                                        <p className="text-[10px] font-bold uppercase opacity-60">Activos</p>
                                        <p className="text-4xl font-black">{maestros.filter(m => m.estado === 'Activo').length}</p>
                                    </div>
                                    <button 
                                        onClick={() => { setMaestroEnEdicion(null); setModalFormularioAbierto(true); }}
                                        className="bg-white p-5 rounded-[32px] border border-slate-100 flex flex-col justify-between text-left shadow-sm active:scale-95 transition-all"
                                    >
                                        <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center">
                                            <i className="fas fa-plus"></i>
                                        </div>
                                        <p className="font-bold text-slate-700 leading-tight">Nueva<br/>Inscripción</p>
                                    </button>
                                </div>

                                <div className="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
                                    <h3 className="font-bold text-slate-800 mb-4">Contactos Recientes</h3>
                                    <div className="space-y-4">
                                        {maestros.filter(m => m.estado === 'Activo').slice(0, 4).map(m => (
                                            <div key={m.id} className="flex items-center justify-between">
                                                <div className="flex items-center space-x-3">
                                                    <div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">
                                                        {m.nombre.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <p className="font-bold text-sm text-slate-700">{m.nombre}</p>
                                                        <p className="text-[10px] text-slate-400">{m.clase}</p>
                                                    </div>
                                                </div>
                                                {m.telefono && (
                                                    <a href={`tel:${m.telefono}`} className="text-indigo-500 w-8 h-8 bg-indigo-50 rounded-lg flex items-center justify-center">
                                                        <i className="fas fa-phone-alt text-xs"></i>
                                                    </a>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tabActiva === 'lista' && (
                            <div className="space-y-4">
                                <div className="bg-white p-2 rounded-2xl shadow-sm border border-slate-100 flex items-center px-4">
                                    <i className="fas fa-search text-slate-300 mr-3"></i>
                                    <input
                                        type="text"
                                        placeholder="Buscar por nombre..."
                                        value={busqueda}
                                        onChange={(e) => setBusqueda(e.target.value)}
                                        className="w-full py-3 focus:outline-none bg-transparent"
                                    />
                                </div>

                                {maestrosVisibles.map((m) => (
                                    <div key={m.id} className="bg-white rounded-[32px] p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <p className="text-[10px] font-black text-indigo-400 uppercase mb-1">{m.clase}</p>
                                                <h3 className="font-bold text-slate-800 text-lg">{m.nombre}</h3>
                                            </div>
                                            {m.telefono && (
                                                <a href={`https://wa.me/${m.telefono.replace(/\D/g,'')}`} target="_blank" className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">
                                                    <i className="fab fa-whatsapp text-xl"></i>
                                                </a>
                                            )}
                                        </div>
                                        
                                        {esAdmin && (
                                            <div className="flex border-t border-slate-50 pt-4 mt-2 space-x-2">
                                                <button onClick={() => { setMaestroEnEdicion(m); setModalFormularioAbierto(true); }} className="flex-1 py-2 bg-slate-50 text-slate-500 text-[10px] font-black uppercase rounded-lg">Editar</button>
                                                <button onClick={() => setIdMaestroAEliminar(m.id)} className="px-4 py-2 bg-rose-50 text-rose-400 rounded-lg text-[10px]"><i className="fas fa-trash"></i></button>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <nav className="bg-white border-t border-slate-100 fixed bottom-0 w-full h-20 flex justify-around items-center px-10">
                        <button onClick={() => setTabActiva('inicio')} className={`flex flex-col items-center ${tabActiva === 'inicio' ? 'text-indigo-600' : 'text-slate-300'}`}>
                            <i className="fas fa-home text-xl"></i>
                            <span className="text-[9px] font-black uppercase mt-1">Inicio</span>
                        </button>
                        <button onClick={() => setTabActiva('lista')} className={`flex flex-col items-center ${tabActiva === 'lista' ? 'text-indigo-600' : 'text-slate-300'}`}>
                            <div className="relative">
                                <i className="fas fa-users text-xl"></i>
                                {esAdmin && pendientes.length > 0 && <span className="absolute -top-1 -right-1 w-2 h-2 bg-rose-500 rounded-full"></span>}
                            </div>
                            <span className="text-[9px] font-black uppercase mt-1">Directorio</span>
                        </button>
                    </nav>

                    {modalFormularioAbierto && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-end sm:items-center justify-center z-50">
                            <div className="bg-white w-full max-w-md rounded-t-[40px] sm:rounded-[40px] p-8 pb-12 shadow-2xl">
                                <h2 className="text-2xl font-black text-slate-800 mb-6">{maestroEnEdicion ? 'Editar Registro' : 'Inscribir Nuevo'}</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    guardarMaestro(Object.fromEntries(formData.entries()));
                                }} className="space-y-4">
                                    <input type="text" name="nombre" placeholder="Nombre y Apellidos" required defaultValue={maestroEnEdicion?.nombre || ''} className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" />
                                    <input type="tel" name="telefono" placeholder="Número de WhatsApp" defaultValue={maestroEnEdicion?.telefono || ''} className="w-full p-4 bg-slate-50 rounded-2xl outline-none" />
                                    <select name="clase" defaultValue={maestroEnEdicion?.clase || 'Párvulos'} className="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                                        {['Cuna', 'Párvulos', 'Principiantes', 'Primarios', 'Intermedios', 'Jóvenes', 'Adultos', 'Logística', 'Dirección'].map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <button type="submit" className="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl shadow-xl mt-4 active:scale-95 transition-all">
                                        {esAdmin ? 'Guardar Cambios' : 'Enviar Solicitud'}
                                    </button>
                                    <button type="button" onClick={() => setModalFormularioAbierto(false)} className="w-full py-2 text-slate-300 font-bold text-xs uppercase tracking-widest mt-2">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {idMaestroAEliminar && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-6">
                            <div className="bg-white rounded-[40px] p-8 w-full max-w-xs text-center">
                                <h3 className="text-xl font-bold">¿Borrar registro?</h3>
                                <p className="text-slate-400 text-sm mb-6 mt-2">Esta acción eliminará los datos permanentemente de la nube.</p>
                                <div className="space-y-3">
                                    <button onClick={async () => { await db.collection('maestros').doc(idMaestroAEliminar).delete(); setIdMaestroAEliminar(null); }} className="w-full py-4 bg-rose-500 text-white font-bold rounded-2xl">Sí, eliminar</button>
                                    <button onClick={() => setIdMaestroAEliminar(null)} className="w-full py-2 text-slate-300 font-bold uppercase text-[10px]">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
